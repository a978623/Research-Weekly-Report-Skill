name: Validate skill project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate structure and links
        run: python scripts/validate_project.py
      - name: Run standard library tests
        run: python -m unittest discover -s tests -v
      - name: Build distribution archives
        run: python scripts/package_skill.py
